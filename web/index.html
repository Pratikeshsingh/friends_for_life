<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#062B55">
  <meta name="color-scheme" content="light">
  <meta name="description" content="VriendTime helps people meet nearby through small, planned meetups.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VriendTime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VriendTime</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      --launch-canvas: #f8f5ef;
      --launch-surface: #fffcf7;
      --launch-ink: #08294a;
      --launch-navy: #062b55;
      --launch-muted: #66727c;
      --launch-teal: #36b8a5;
      --launch-teal-soft: #e7f4f2;
      --launch-outline: #dde7e3;
      --launch-cycle: 1.6s;
      --launch-gather-ease: cubic-bezier(0.45, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--launch-canvas);
    }

    body {
      overflow: hidden;
    }

    #app-loading {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      box-sizing: border-box;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(28px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 12%, rgba(54, 184, 165, 0.12), transparent 34%),
        radial-gradient(circle at 88% 84%, rgba(255, 119, 89, 0.08), transparent 32%),
        var(--launch-canvas);
      color: var(--launch-ink);
      font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      transition: opacity 180ms ease-out, visibility 180ms ease-out;
    }

    #app-loading.is-ready {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .launch-content {
      display: flex;
      width: min(100%, 420px);
      flex-direction: column;
      align-items: center;
    }

    .launch-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: clamp(40px, 8vh, 72px);
      color: var(--launch-navy);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .launch-brand-dot {
      position: relative;
      width: 17px;
      height: 15px;
    }

    .launch-brand-dot::before,
    .launch-brand-dot::after {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
    }

    .launch-brand-dot::before {
      top: 0;
      left: 5px;
      background: var(--launch-teal);
    }

    .launch-brand-dot::after {
      bottom: 0;
      left: 0;
      background: var(--launch-navy);
      box-shadow: 10px 0 0 #ff7759;
    }

    .launch-scene {
      position: relative;
      width: 150px;
      height: 118px;
      margin-bottom: 28px;
    }

    .launch-table {
      position: absolute;
      top: 42px;
      left: 50%;
      width: 92px;
      height: 52px;
      transform: translateX(-50%);
      border: 2px solid rgba(6, 43, 85, 0.12);
      border-radius: 50%;
      background: var(--launch-surface);
      box-shadow: 0 16px 30px rgba(8, 41, 74, 0.08);
    }

    .launch-table::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: var(--launch-teal-soft);
      content: "";
      animation: launch-table-welcome var(--launch-cycle)
        var(--launch-gather-ease) infinite;
      will-change: transform, opacity;
    }

    .launch-person {
      position: absolute;
      z-index: 1;
      width: 34px;
      height: 34px;
      border: 5px solid var(--launch-canvas);
      border-radius: 50%;
      box-shadow: 0 5px 12px rgba(8, 41, 74, 0.1);
      will-change: transform;
    }

    .launch-person-one {
      top: 0;
      left: 58px;
      background: var(--launch-teal);
      animation: launch-person-one-gather var(--launch-cycle)
        var(--launch-gather-ease) infinite;
    }

    .launch-person-two {
      right: 4px;
      bottom: 3px;
      background: #ff7759;
      animation: launch-person-two-gather var(--launch-cycle)
        var(--launch-gather-ease) infinite;
    }

    .launch-person-three {
      bottom: 3px;
      left: 4px;
      background: var(--launch-navy);
      animation: launch-person-three-gather var(--launch-cycle)
        var(--launch-gather-ease) infinite;
    }

    .launch-title {
      margin: 0;
      color: var(--launch-ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .launch-copy {
      max-width: 290px;
      margin: 12px 0 0;
      color: var(--launch-muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .launch-progress {
      position: relative;
      width: 132px;
      height: 3px;
      margin-top: 34px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--launch-outline);
    }

    .launch-progress::after {
      position: absolute;
      inset: 0 auto 0 0;
      width: 44%;
      border-radius: inherit;
      background: var(--launch-teal);
      content: "";
      animation: launch-progress var(--launch-cycle) ease-in-out infinite;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .javascript-required {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: grid;
      box-sizing: border-box;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: var(--launch-canvas);
      color: var(--launch-ink);
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      text-align: center;
    }

    @keyframes launch-progress {
      0% {
        transform: translateX(-110%);
      }
      55%,
      100% {
        transform: translateX(230%);
      }
    }

    @keyframes launch-person-one-gather {
      0%,
      12%,
      100% {
        transform: translate3d(0, -5px, 0);
      }
      44%,
      68% {
        transform: translate3d(0, 1px, 0);
      }
    }

    @keyframes launch-person-two-gather {
      0%,
      12%,
      100% {
        transform: translate3d(5px, 4px, 0);
      }
      44%,
      68% {
        transform: translate3d(-2px, -1px, 0);
      }
    }

    @keyframes launch-person-three-gather {
      0%,
      12%,
      100% {
        transform: translate3d(-5px, 4px, 0);
      }
      44%,
      68% {
        transform: translate3d(2px, -1px, 0);
      }
    }

    @keyframes launch-table-welcome {
      0%,
      24%,
      100% {
        opacity: 0.55;
        transform: translate(-50%, -50%) scaleX(0.82);
      }
      44%,
      68% {
        opacity: 1;
        transform: translate(-50%, -50%) scaleX(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading {
        transition: none;
      }

      .launch-progress::after {
        left: 28%;
        animation: none;
      }

      .launch-person {
        animation: none;
        transform: none;
        will-change: auto;
      }

      .launch-table::after {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%);
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <main class="launch-content" aria-labelledby="launch-title" aria-describedby="launch-copy launch-status">
      <div class="launch-brand" aria-label="VriendTime">
        <span class="launch-brand-dot" aria-hidden="true"></span>
        <span aria-hidden="true">VriendTime</span>
      </div>
      <div class="launch-scene" aria-hidden="true">
        <span class="launch-person launch-person-one"></span>
        <span class="launch-person launch-person-two"></span>
        <span class="launch-person launch-person-three"></span>
        <span class="launch-table"></span>
      </div>
      <h1 class="launch-title" id="launch-title">Meet people over a real table.</h1>
      <p class="launch-copy" id="launch-copy">Getting your place ready&hellip;</p>
      <div class="launch-progress" role="progressbar" aria-label="Loading VriendTime"></div>
      <p class="sr-only" id="launch-status" role="status" aria-live="polite">VriendTime is loading.</p>
    </main>
  </div>
  <noscript>
    <p class="javascript-required">VriendTime needs JavaScript to run. Please enable JavaScript and reload this page.</p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingShell = document.getElementById('app-loading');
      if (!loadingShell) return;

      loadingShell.setAttribute('aria-hidden', 'true');
      loadingShell.classList.add('is-ready');

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        loadingShell.remove();
        return;
      }

      window.setTimeout(function () {
        loadingShell.remove();
      }, 200);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
