name: App checks
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: ./scripts/check-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vriendtime-web
          path: build/web
