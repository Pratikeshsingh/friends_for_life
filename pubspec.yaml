name: vriendtime
version: 1.0.0+2
publish_to: 'none'
description: "Friendship Circles: familiar faces and weekly plans, close to home."

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.9
  supabase_flutter: ^2.10.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/generated/home-hero-coffee.webp
    - assets/generated/home-hero-dinner.webp
    - assets/generated/home-hero-lunch.webp
    - assets/generated/home-continuous-scene-v3.webp
    - assets/generated/meetups-continuous-scene-v3.webp
    - assets/generated/profile-continuous-scene-v3.webp
    - assets/generated/browse-more-meetups-v1.webp
    - assets/generated/landing-open-seat-desktop-v1.webp
    - assets/generated/landing-open-seat-mobile-v1.webp
    - assets/generated/launch-table-meetup.webp
    - assets/generated/meetup-coffee-reserved.webp
    - assets/generated/meetup-dinner-reserved.webp
    - assets/generated/meetup-lunch-reserved.webp
    - assets/generated/onboarding-complete-banner.webp
    - assets/generated/onboarding-account-immersive-v2.webp
    - assets/generated/onboarding-details-immersive-v2.webp
    - assets/generated/onboarding-hero.webp
    - assets/generated/profile-default-avatar.webp
    - assets/generated/profile-header-illustration.webp
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    # Flutter web downloads Roboto from Google as its default font unless the
    # app ships a family with that name. Pointing it at Manrope keeps any text
    # without a font in the house style and saves a request to Google.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
